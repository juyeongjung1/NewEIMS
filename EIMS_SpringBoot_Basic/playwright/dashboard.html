<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EIMS 実装診断アプリ</title>
  <style>
    :root{--navy:#102b45;--blue:#2c74d8;--cyan:#26b6c8;--green:#168454;--red:#c43b45;--ink:#203040;--muted:#66788a;--bg:#eef4f8}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 85% 5%,#d7f3f5 0,transparent 30%),var(--bg);color:var(--ink);font-family:"Yu Gothic UI","Meiryo",sans-serif}
    header{padding:28px 5vw;color:white;background:linear-gradient(125deg,var(--navy),#245779);box-shadow:0 8px 30px #102b4530}header h1{margin:0;font-size:clamp(22px,3vw,32px)}header p{margin:5px 0 0;color:#d5e9f5}
    main{width:min(1060px,calc(100% - 32px));margin:36px auto}.grid{display:grid;grid-template-columns:360px 1fr;gap:24px}.card{background:#fff;border:1px solid #dce6ed;border-radius:22px;box-shadow:0 16px 42px #183b5514}
    .progress-card{padding:34px;display:flex;flex-direction:column;align-items:center;text-align:center}.ring{--value:1;position:relative;width:220px;height:220px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--cyan) calc(var(--value)*1%),#e5edf2 0);transition:background .45s ease;animation:pulse 2.2s ease-in-out infinite}.ring:before{content:"";position:absolute;inset:15px;border-radius:50%;background:white}.ring-content{position:relative}.percent{font-size:52px;line-height:1;font-weight:850;color:var(--navy)}.percent small{font-size:20px}.phase{margin-top:8px;color:var(--muted);font-weight:700}.count{margin:24px 0 0;font-size:16px}.count strong{font-size:25px;color:var(--blue)}
    .detail{padding:30px}.eyebrow{color:var(--blue);font-size:13px;font-weight:800;letter-spacing:.1em}.detail h2{min-height:64px;margin:8px 0 12px;font-size:clamp(20px,3vw,29px)}.status{display:flex;gap:10px;align-items:center;color:var(--muted)}.dot{width:10px;height:10px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 7px #26b6c81c;animation:blink 1.2s infinite}
    .bar{height:10px;margin:26px 0;background:#e5edf2;border-radius:99px;overflow:hidden}.bar span{display:block;width:1%;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--blue),var(--cyan));transition:width .45s ease}
    .log-title{display:flex;justify-content:space-between;align-items:center;margin-top:24px}.log-title h3{margin:0;font-size:15px}.log{height:220px;overflow:auto;margin-top:10px;padding:8px 16px;background:#f7fafc;border:1px solid #e1e9ef;border-radius:14px}.entry{display:grid;grid-template-columns:64px 1fr;gap:9px;padding:10px 0;border-bottom:1px solid #e6edf2;font-size:13px}.entry:last-child{border:0}.entry time{color:#8795a3}.entry.pass{color:var(--green)}.entry.fail{color:var(--red)}
    .actions{display:flex;gap:10px;margin-top:20px}.button{display:none;text-decoration:none;border:0;border-radius:12px;padding:12px 18px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer}.button.visible{display:inline-block}.complete .ring{animation:none;background:conic-gradient(var(--green) 100%,#e5edf2 0)}.failed .ring{animation:none;background:conic-gradient(var(--red) 100%,#e5edf2 0)}.complete .dot,.failed .dot{animation:none}.complete .dot{background:var(--green)}.failed .dot{background:var(--red)}
    @keyframes pulse{50%{box-shadow:0 0 0 12px #26b6c810}}@keyframes blink{50%{opacity:.3}}@media(max-width:800px){.grid{grid-template-columns:1fr}.progress-card{padding:25px}.ring{width:180px;height:180px}.detail h2{min-height:auto}}
  </style>
</head>
<body>
  <header><h1>EIMS 実装診断アプリ</h1><p>共通機能 ＞ 検索機能</p></header>
  <main><div class="grid">
    <section class="card progress-card"><div class="ring" id="ring"><div class="ring-content"><div class="percent"><span id="percent">1</span><small>%</small></div><div class="phase" id="phase">開始</div></div></div><p class="count"><strong id="completed">0</strong> / <span id="total">29</span> 件 完了</p></section>
    <section class="card detail"><div class="eyebrow">現在の確認内容</div><h2 id="message">診断の準備をしています...</h2><div class="status"><span class="dot"></span><span id="statusText">しばらくお待ちください</span></div><div class="bar"><span id="bar"></span></div><div class="log-title"><h3>進行状況</h3><span id="resultCount">合格 0 ／ 要確認 0 ／ 対象外 0</span></div><div class="log" id="log" aria-live="polite"></div><div class="actions"><a class="button" id="report" href="/report" target="_blank">詳しい結果報告書を見る</a></div></section>
  </div></main>
  <script>
    const $=id=>document.getElementById(id);let passed=0,failed=0,skipped=0,lastKey='';
    const addLog=e=>{const key=[e.percent,e.message,e.result,e.status].join('|');if(key===lastKey)return;lastKey=key;const row=document.createElement('div');row.className='entry '+(e.result==='passed'?'pass':e.result==='failed'?'fail':'');const t=new Date(e.time);row.innerHTML=`<time>${t.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}</time><span>${e.result==='passed'?'○ ':e.result==='failed'?'× ':''}${e.message}</span>`;$('log').append(row);$('log').scrollTop=$('log').scrollHeight};
    new EventSource('/events').onmessage=event=>{const e=JSON.parse(event.data);const percent=Math.max(1,Math.min(100,e.percent||1));$('percent').textContent=percent;$('phase').textContent=e.phase||'確認中';$('message').textContent=e.message||'';$('ring').style.setProperty('--value',percent);$('bar').style.width=percent+'%';if(Number.isInteger(e.completed))$('completed').textContent=e.completed;if(Number.isInteger(e.total))$('total').textContent=e.total;if(e.result==='passed')passed++;if(e.result==='failed')failed++;if(e.result==='skipped')skipped++;$('resultCount').textContent=`合格 ${passed} ／ 要確認 ${failed} ／ 対象外 ${skipped}`;addLog(e);if(e.status==='completed'||e.status==='failed'){document.body.classList.add(e.status==='completed'?'complete':'failed');$('statusText').textContent=e.status==='completed'?'診断が完了しました':'確認が必要な項目があります';if(e.reportReady)$('report').classList.add('visible')}};
    fetch('/start',{method:'POST'}).catch(()=>{$('message').textContent='診断を開始できませんでした。';});
  </script>
</body>
</html>
