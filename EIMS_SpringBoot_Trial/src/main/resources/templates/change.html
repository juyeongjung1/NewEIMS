<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EIMS 社員情報変更</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center">
                        <h1 class="h3 mb-0">社員情報変更</h1>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/changeConfirm}" th:object="${employeeForm}" method="post">
                            <!-- 社員番号 (変更不可、hidden で送信) -->
                            <input type="hidden" th:field="*{empNo}">
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">社員番号</label>
                                <p class="form-control-plaintext fs-5 fw-bold text-danger" th:text="*{empNo}">10001</p>
                            </div>
                            
                            <!-- 氏名 (漢字) -->
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="lastName" class="form-label fw-bold">氏 (漢字)</label>
                                    <input type="text" th:field="*{lastName}" class="form-control" th:errorclass="is-invalid">
                                    <div class="invalid-feedback" th:errors="*{lastName}">氏を入力してください</div>
                                </div>
                                <div class="col-md-6">
                                    <label for="firstName" class="form-label fw-bold">名 (漢字)</label>
                                    <input type="text" th:field="*{firstName}" class="form-control" th:errorclass="is-invalid">
                                    <div class="invalid-feedback" th:errors="*{firstName}">名を入力してください</div>
                                </div>
                            </div>
                            
                            <!-- 氏名 (カナ) -->
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="lastKana" class="form-label fw-bold">氏 (カナ)</label>
                                    <input type="text" th:field="*{lastKana}" class="form-control" th:errorclass="is-invalid">
                                    <div class="invalid-feedback" th:errors="*{lastKana}">氏 (カナ) を入力してください</div>
                                </div>
                                <div class="col-md-6">
                                    <label for="firstKana" class="form-label fw-bold">名 (カナ)</label>
                                    <input type="text" th:field="*{firstKana}" class="form-control" th:errorclass="is-invalid">
                                    <div class="invalid-feedback" th:errors="*{firstKana}">名 (カナ) を入力してください</div>
                                </div>
                            </div>
                            
                            <!-- パスワード -->
                            <div class="mb-3">
                                <label for="password" class="form-label fw-bold">パスワード</label>
                                <input type="password" th:field="*{password}" class="form-control" th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:errors="*{password}">パスワードを入力してください</div>
                            </div>
                            
                            <!-- 性別 -->
                            <div class="mb-3">
                                <label class="form-label fw-bold d-block">性別</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" th:field="*{gender}" th:errorclass="is-invalid" value="1" id="genderMale">
                                    <label class="form-check-label" for="genderMale">男性</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" th:field="*{gender}" th:errorclass="is-invalid" value="2" id="genderFemale">
                                    <label class="form-check-label" for="genderFemale">女性</label>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}">性別を選択してください</div>
                            </div>
                            
                            <!-- 部署 -->
                            <div class="mb-4">
                                <label for="deptNo" class="form-label fw-bold">所属部署</label>
                                <select th:field="*{deptNo}" class="form-select" th:errorclass="is-invalid">
                                    <option value="">選択してください</option>
                                    <option th:each="dept : ${departments}" th:value="${dept.deptNo}" th:text="${dept.deptName}">人事部</option>
                                </select>
                                <div class="invalid-feedback" th:errors="*{deptNo}">部署を選択してください</div>
                            </div>
                            
                            <div class="d-flex justify-content-between mt-4">
                                <a th:href="@{/detail/{empNo}(empNo=*{empNo})}" class="btn btn-secondary">詳細画面に戻る</a>
                                <button type="submit" class="btn btn-primary fw-bold px-4">確認画面へ</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
