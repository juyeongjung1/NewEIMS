<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EIMS 社員詳細情報</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center">
                        <h1 class="h3 mb-0">社員詳細情報</h1>
                    </div>
                    <div class="card-body p-4">
                        <table class="table table-bordered">
                            <tbody>
                                <tr>
                                    <th class="table-light" style="width: 30%;">社員番号</th>
                                    <td th:text="${employee.empNo}">10001</td>
                                </tr>
                                <tr>
                                    <th class="table-light">氏 (漢字)</th>
                                    <td th:text="${employee.lastName}">長嶋</td>
                                </tr>
                                <tr>
                                    <th class="table-light">名 (漢字)</th>
                                    <td th:text="${employee.firstName}">陽翔</td>
                                </tr>
                                <tr>
                                    <th class="table-light">氏 (カナ)</th>
                                    <td th:text="${employee.lastKana}">ナガシマ</td>
                                </tr>
                                <tr>
                                    <th class="table-light">名 (カナ)</th>
                                    <td th:text="${employee.firstKana}">ヒナタ</td>
                                </tr>
                                <tr>
                                    <th class="table-light">性別</th>
                                    <td th:text="${employee.gender == 1 ? '男性' : (employee.gender == 2 ? '女性' : '')}">男性</td>
                                </tr>
                                <tr>
                                    <th class="table-light">所属部署</th>
                                    <td th:text="${employee.department != null ? employee.department.deptName : ''}">人事部</td>
                                </tr>
                            </tbody>
                        </table>
                        
                        <div class="d-flex justify-content-between mt-4">
                            <a th:href="@{/changeInput/{empNo}(empNo=${employee.empNo})}" class="btn btn-warning fw-bold text-dark">情報を変更する</a>
                            <a th:href="@{/deleteConfirm/{empNo}(empNo=${employee.empNo})}" class="btn btn-danger fw-bold">削除する</a>
                        </div>
                        
                        <hr class="my-4">
                        
                        <div class="d-flex justify-content-center gap-3">
                            <a th:href="@{/employeeList}" class="btn btn-secondary">一覧に戻る</a>
                            <a th:href="@{/search}" class="btn btn-secondary">検索に戻る</a>
                            <a th:href="@{/index}" class="btn btn-secondary">トップに戻る</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
