<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EIMS メインメニュー</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center">
                        <h1 class="h3 mb-0">EIMS 社員情報管理システム</h1>
                    </div>
                    <div class="card-body p-4">
                        <h2 class="h5 mb-4 text-secondary text-center">メインメニュー</h2>
                        <div class="d-grid gap-3 col-10 mx-auto">
                            <a th:href="@{/employeeList}" class="btn btn-outline-primary btn-lg py-3">
                                <span class="fw-bold">社員一覧</span>
                                <div class="small text-muted mt-1">登録されているすべての社員を表示します</div>
                            </a>
                            <a th:href="@{/search}" class="btn btn-outline-success btn-lg py-3">
                                <span class="fw-bold">社員検索</span>
                                <div class="small text-muted mt-1">番号、氏名、部署から社員を検索します</div>
                            </a>
                            <a th:href="@{/input}" class="btn btn-outline-warning btn-lg py-3 text-dark">
                                <span class="fw-bold">新規登録</span>
                                <div class="small text-muted mt-1">新しい社員の情報を登録します</div>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
