<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EIMS 変更内容の確認</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center">
                        <h1 class="h3 mb-0">変更内容の確認</h1>
                    </div>
                    <div class="card-body p-4">
                        <div class="alert alert-info text-center">
                            以下の内容で更新します。よろしいですか？
                        </div>
                        
                        <form th:object="${employeeForm}" method="post">
                            <!-- フォーム値を hidden で保持 -->
                            <input type="hidden" th:field="*{empNo}">
                            <input type="hidden" th:field="*{lastName}">
                            <input type="hidden" th:field="*{firstName}">
                            <input type="hidden" th:field="*{lastKana}">
                            <input type="hidden" th:field="*{firstKana}">
                            <input type="hidden" th:field="*{password}">
                            <input type="hidden" th:field="*{gender}">
                            <input type="hidden" th:field="*{deptNo}">
                            
                            <table class="table table-bordered">
                                <tbody>
                                    <tr>
                                        <th class="table-light" style="width: 30%;">社員番号</th>
                                        <td th:text="*{empNo}">10001</td>
                                    </tr>
                                    <tr>
                                        <th class="table-light">氏名</th>
                                        <td th:text="*{lastName + ' ' + firstName}">山田 太郎</td>
                                    </tr>
                                    <tr>
                                        <th class="table-light">氏名 (カナ)</th>
                                        <td th:text="*{lastKana + ' ' + firstKana}">ヤマダ タロウ</td>
                                    </tr>
                                    <tr>
                                        <th class="table-light">パスワード</th>
                                        <td th:text="${#strings.repeat('*', #strings.length(employeeForm.password))} + ' (非表示)'">******** (非表示)</td>
                                    </tr>
                                    <tr>
                                        <th class="table-light">性別</th>
                                        <td th:text="*{gender == 1 ? '男性' : (gender == 2 ? '女性' : '')}">男性</td>
                                    </tr>
                                    <tr>
                                        <th class="table-light">所属部署</th>
                                        <td th:text="${department.deptName}">人事部</td>
                                    </tr>
                                </tbody>
                            </table>
                            
                            <div class="d-flex justify-content-between mt-4">
                                <button type="submit" th:formaction="@{/changeInput/{empNo}(empNo=*{empNo})}" class="btn btn-secondary px-4">修正する</button>
                                <button type="submit" th:formaction="@{/changeEmployee}" class="btn btn-primary fw-bold px-4">変更確定する</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
