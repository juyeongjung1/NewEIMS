<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EIMS 検索結果一覧</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center">
                <h1 class="h3 mb-0">検索結果一覧</h1>
            </div>
            <div class="card-body p-4">
                <!-- エラーメッセージ表示（結果0件の時） -->
                <div th:if="${errorMessage}" class="alert alert-warning text-center" th:text="${errorMessage}">
                    検索条件に一致する社員は見つかりませんでした。
                </div>
                
                <!-- 検索結果テーブル（結果が存在する時のみ表示） -->
                <div th:if="${not #lists.isEmpty(employees)}" class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th style="width: 15%;">社員番号</th>
                                <th style="width: 45%;">氏名 (カナ)</th>
                                <th style="width: 15%;">性別</th>
                                <th style="width: 25%;">部署名</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="emp : ${employees}">
                                <td th:text="${emp.empNo}">10001</td>
                                <td>
                                    <a th:href="@{/detail/{empNo}(empNo=${emp.empNo})}" th:text="${emp.lastName + ' ' + emp.firstName + ' (' + emp.lastKana + ' ' + emp.firstKana + ')'}">
                                        長嶋 陽翔 (ナガシマ ヒナタ)
                                    </a>
                                </td>
                                <td th:text="${emp.gender == 1 ? '男性' : (emp.gender == 2 ? '女性' : '')}">男性</td>
                                <td th:text="${emp.department != null ? emp.department.deptName : ''}">人事部</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <div class="mt-4 text-center d-flex justify-content-center gap-3">
                    <a th:href="@{/search}" class="btn btn-secondary">検索画面に戻る</a>
                    <a th:href="@{/index}" class="btn btn-secondary">メニューに戻る</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
