<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EIMS 社員情報登録完了</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-success text-white text-center">
                        <h1 class="h3 mb-0">社員情報登録完了</h1>
                    </div>
                    <div class="card-body p-4 text-center">
                        <div class="alert alert-success my-4 py-3">
                            <h2 class="h5 alert-heading mb-2" th:text="${#messages.msg('M001')}">登録が完了しました</h2>
                            <p class="mb-0" th:text="${#messages.msg('M002')}">新しい社員情報が正常にデータベースに保存されました。</p>
                            <p class="mt-3 fw-bold">社員番号: <span class="fs-4 text-danger" th:text="${employee.empNo}">10021</span></p>
                        </div>
                        
                        <div class="d-flex justify-content-center gap-3 mt-4">
                            <a th:href="@{/input}" class="btn btn-primary fw-bold px-4">続けて登録する</a>
                            <a th:href="@{/index}" class="btn btn-secondary">メニューに戻る</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
