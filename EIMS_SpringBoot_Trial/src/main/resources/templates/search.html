<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EIMS 社員検索</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center">
                        <h1 class="h3 mb-0">社員検索</h1>
                    </div>
                    <div class="card-body p-4">
                        <!-- エラーメッセージ表示 -->
                        <div th:if="${errorMessage}" class="alert alert-danger text-center" th:text="${errorMessage}">
                            エラーメッセージ
                        </div>
                        
                        <!-- 社員番号で検索 -->
                        <div class="card mb-4">
                            <div class="card-body">
                                <h2 class="card-title h5 mb-3 text-secondary">社員番号で検索</h2>
                                <form th:action="@{/selectByEmpNo}" method="get">
                                    <div class="input-group mb-3">
                                        <input type="number" name="empNo" class="form-control" placeholder="社員番号を入力" required>
                                        <button class="btn btn-primary" type="submit">検索</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                        
                        <!-- 氏名で検索 -->
                        <div class="card mb-4">
                            <div class="card-body">
                                <h2 class="card-title h5 mb-3 text-secondary">氏名で検索</h2>
                                <form th:action="@{/selectByEmpName}" method="get">
                                    <div class="input-group mb-3">
                                        <input type="text" name="name" class="form-control" placeholder="氏名を入力 (部分一致)" required>
                                        <button class="btn btn-primary" type="submit">検索</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                        
                        <!-- 部署で検索 -->
                        <div class="card mb-4">
                            <div class="card-body">
                                <h2 class="card-title h5 mb-3 text-secondary">部署で検索</h2>
                                <form th:action="@{/selectByDeptNo}" method="get">
                                    <div class="input-group mb-3">
                                        <select name="deptNo" class="form-select" required>
                                            <option value="" disabled selected>部署を選択してください</option>
                                            <option th:each="dept : ${departments}" th:value="${dept.deptNo}" th:text="${dept.deptName}">人事部</option>
                                        </select>
                                        <button class="btn btn-primary" type="submit">検索</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                        
                        <div class="mt-4 text-center">
                            <a th:href="@{/index}" class="btn btn-secondary">メニューに戻る</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
